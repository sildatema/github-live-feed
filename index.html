<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Feed</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8ee;--mut:#8b93a7;--acc:#6ea8fe;--ok:#4ade80;--bad:#f87171;--pur:#c084fc}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--fg:#1b1f2a;--mut:#667085}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0}.mut{color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 20px 24px}
@media(max-width:800px){main{grid-template-columns:1fr}}
section h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.item{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.item.new{animation:flash 2s}@keyframes flash{from{outline:2px solid var(--acc)}to{outline:2px solid transparent}}
img{width:32px;height:32px;border-radius:50%;background:var(--mut);flex:none}
a{color:inherit;text-decoration:none}a:hover .t{text-decoration:underline}
.t{font-weight:600;word-break:break-word}.tag{font-size:12px;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--mut)}
.open{color:var(--ok)}.merged{color:var(--pur)}.closed{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}.dot.ok{background:var(--ok)}
</style></head><body>
<header><h1 id="repo">GitHub Feed</h1><div class="mut"><span id="dot" class="dot"></span><span id="st">laden…</span></div></header>
<main><section><h2>Pushes</h2><div id="pushes"></div></section><section><h2>Pull requests</h2><div id="pulls"></div></section></main>
<script>
// Andere repo? Open de pagina met  ?repo=eigenaar/naam
const REPO = new URLSearchParams(location.search).get("repo") || "15-Braincells-Studios/15-braincells";
const INTERVAL = 60000;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = d => { const s=(Date.now()-new Date(d))/1000; return s<60?"zojuist":s<3600?Math.floor(s/60)+" min geleden":s<86400?Math.floor(s/3600)+" u geleden":Math.floor(s/86400)+" d geleden"; };

// Commit-details per sha onthouden, zodat herladen geen extra verzoeken kost.
const CK = "commits:" + REPO;
let commitCache = {}; try { commitCache = JSON.parse(localStorage.getItem(CK) || "{}"); } catch {}
const saveCache = () => { try { localStorage.setItem(CK, JSON.stringify(commitCache)); } catch {} };

class RateLimited extends Error {}
async function gh(path) {
  // "no-cache" = altijd hervalideren via ETag; een 304 telt niet mee voor de rate limit.
  const r = await fetch(`https://api.github.com/repos/${REPO}${path}`, { cache: "no-cache", headers: { Accept: "application/vnd.github+json" } });
  if (r.status === 403 || r.status === 429) throw new RateLimited(r.headers.get("x-ratelimit-reset"));
  if (!r.ok) throw new Error(r.status + " " + path);
  return r.json();
}

const seen = new Set(); let first = true, timer;
async function load() {
  try {
    const branches = await gh("/branches?per_page=100");
    const pushes = [];
    for (const b of branches) {
      let c = commitCache[b.commit.sha];
      if (!c) {
        const d = await gh("/commits/" + b.commit.sha);
        c = commitCache[b.commit.sha] = { sha: d.sha.slice(0,7), message: d.commit.message.split("\n")[0], author: d.author?.login || d.commit.author.name, avatar: d.author?.avatar_url || "", date: d.commit.author.date, url: d.html_url };
        saveCache();
      }
      pushes.push({ ...c, branch: b.name });
    }
    pushes.sort((a,b) => new Date(b.date) - new Date(a.date));
    const prs = await gh("/pulls?state=all&sort=updated&direction=desc&per_page=20");

    $("repo").textContent = REPO;
    $("dot").className = "dot ok";
    $("st").textContent = "live · elke minuut · bijgewerkt " + new Date().toLocaleTimeString("nl-NL");
    $("pushes").innerHTML = pushes.slice(0,50).map(p => { const k="p"+p.sha+p.branch, n=!first&&!seen.has(k); seen.add(k);
      return `<a href="${p.url}" target="_blank" rel="noopener"><div class="item${n?" new":""}"><img src="${p.avatar}" alt=""><div><div class="t">${esc(p.message)}</div><div class="mut">${esc(p.author)} · <span class="tag">${esc(p.branch)}</span> · ${p.sha} · ${ago(p.date)}</div></div></div></a>`; }).join("") || '<div class="mut">Niets gevonden</div>';
    $("pulls").innerHTML = prs.map(p => { const st=p.merged_at?"merged":p.draft?"draft":p.state, k="r"+p.number+p.updated_at, n=!first&&!seen.has(k); seen.add(k);
      return `<a href="${p.html_url}" target="_blank" rel="noopener"><div class="item${n?" new":""}"><img src="${p.user.avatar_url}" alt=""><div><div class="t">#${p.number} ${esc(p.title)}</div><div class="mut">${esc(p.user.login)} · <span class="${st}">${st}</span> · ${esc(p.head.ref)} → ${esc(p.base.ref)} · ${ago(p.updated_at)}</div></div></div></a>`; }).join("") || '<div class="mut">Geen PRs</div>';
    first = false;
  } catch (e) {
    $("dot").className = "dot";
    $("st").textContent = e instanceof RateLimited
      ? "GitHub-limiet bereikt, probeer het straks opnieuw" + (e.message ? " (vanaf " + new Date(e.message*1000).toLocaleTimeString("nl-NL") + ")" : "")
      : "fout: " + e.message;
  }
}
function schedule() { clearInterval(timer); timer = setInterval(() => { if (!document.hidden) load(); }, INTERVAL); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load(); schedule();
</script></body></html>
